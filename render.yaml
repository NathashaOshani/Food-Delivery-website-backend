# Create one Blueprint from the backend repo; it deploys BOTH separate repos.
services:
  - type: web
    name: dailydish-demo-api
    runtime: node
    plan: free
    repo: https://github.com/NathashaOshani/Food-Delivery-website-backend
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: IMAGE_STORAGE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: web
    name: dailydish-demo
    repo: https://github.com/NathashaOshani/Food-Delivery-website-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
